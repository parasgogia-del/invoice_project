{% extends "base.html" %}


{% block content %}


<h1 class="title">
Customers
</h1>


<a class="button is-primary"
href="/customers/add">

Add Customer

</a>



<table class="table mt-5">


<tr>

<th>Name</th>
<th>Email</th>
<th>Phone</th>

</tr>



{% for customer in customers %}

<tr>

<td>
{{ customer.name }}
</td>


<td>
{{ customer.email }}
</td>


<td>
{{ customer.phone }}
</td>


</tr>


{% endfor %}


</table>


{% endblock %}
